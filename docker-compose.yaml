services:
  lynq-iam:
    build: ./lynq-iam
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - DB_URL=jdbc:mysql://mysql:3306/lynq_iam_db
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-testpassword123}
      - REDIS_ADDRESS=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRATION_MINUTES=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-15}
      - JWT_REFRESH_TOKEN_EXPIRATION_DAYS=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-30}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  lynq-file-storage:
    build: ./lynq-file-storage
    ports:
      - "8085:8080"
      - "8086:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - DB_URL=jdbc:mysql://mysql:3306/lynq_file_storage_db
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-testpassword123}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-lynq-bucket}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-http://localstack:4566}
    depends_on:
      mysql:
        condition: service_healthy
      localstack:
        condition: service_healthy

  lynq-app-backend:
    build: ./lynq-app-backend
    ports:
      - "8082:8080"
      - "8083:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - DB_URL=jdbc:mysql://mysql:3306/lynq_backend_db
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-testpassword123}
      - LYNQ_IAM_URL=http://lynq-iam:8080/lynq-iam
      - LYNQ_FILE_STORAGE_URL=http://lynq-file-storage:8080/lynq-file-storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      lynq-iam:
        condition: service_started
      lynq-file-storage:
        condition: service_started

  lynq-bff:
    build: ./lynq-bff
    ports:
      - "8087:8080"
      - "8088:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - JWT_SECRET=${JWT_SECRET}
      - LYNQ_BACKEND_URL=http://lynq-app-backend:8080/lynq-backend-app
      - LYNQ_ML_URL=http://lynq-ml:8084/lynq-ml
      - LYNQ_FILE_STORAGE_URL=http://lynq-file-storage:8080/lynq-file-storage
    depends_on:
      lynq-app-backend:
        condition: service_started
      lynq-file-storage:
        condition: service_started
      lynq-ml:
        condition: service_started

  lynq-app-frontend:
    build:
      context: ./lynq-app-frontend
      args:
        - LYNQ_IAM_BASE_URL=${LYNQ_IAM_BASE_URL:-http://localhost:8080/lynq-iam}
        - LYNQ_BFF_BASE_URL=${LYNQ_BFF_BASE_URL:-http://localhost:8087/lynq-bff}
    ports:
      - "3000:8080"
    depends_on:
      - lynq-iam
      - lynq-bff

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$${OLLAMA_MODEL}\""]
    restart: "no"

  lynq-ml:
    build: ./lynq-ml
    ports:
      - "8084:8084"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - PORT=8084
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/lynq-ml/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mysql:
    image: mysql:9.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-testpassword123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: gresau/localstack-persist:4.5
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-lynq-bucket}
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d:ro
      - localstack_data:/persisted-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": \"\\(running\\|available\\)\"'"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command:
      - "redis-server"
      - "--user"
      - "default"
      - "off"
      - "--user"
      - "${REDIS_USERNAME:-root}"
      - "on"
      - ">${REDIS_PASSWORD:-password}"
      - "~*"
      - "&*"
      - "+@all"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "${REDIS_USERNAME:-root}", "-a", "${REDIS_PASSWORD:-password}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  localstack_data:
  ollama_data:
