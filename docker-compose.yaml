services:
  lynq-iam:
    build: ./lynq-iam
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - DB_URL=jdbc:mysql://mysql:3306/lynq_iam_db
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-testpassword123}
      - REDIS_ADDRESS=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRATION_MINUTES=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-15}
      - JWT_REFRESH_TOKEN_EXPIRATION_DAYS=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-30}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  lynq-file-storage:
    build: ./lynq-file-storage
    ports:
      - "8085:8080"
      - "8086:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - DB_URL=jdbc:mysql://mysql:3306/lynq_file_storage_db
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-testpassword123}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-lynq-bucket}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-http://localstack:4566}
      - LYNQ_IAM_URL=http://lynq-iam:8080/lynq-iam
    depends_on:
      mysql:
        condition: service_healthy
      localstack:
        condition: service_healthy
      lynq-iam:
        condition: service_started

  lynq-app-backend:
    build: ./lynq-app-backend
    ports:
      - "8082:8080"
      - "8083:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - DB_URL=jdbc:mysql://mysql:3306/lynq_backend_db
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-testpassword123}
      - LYNQ_IAM_URL=http://lynq-iam:8080/lynq-iam
      - LYNQ_FILE_STORAGE_URL=http://lynq-file-storage:8080/lynq-file-storage
      - LYNQ_INTERNAL_TOKEN=${LYNQ_INTERNAL_TOKEN:-local-internal-token-not-a-secret}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_ENDPOINT=${AWS_ENDPOINT:-http://localstack:4566}
      - LYNQ_DOMAIN_EVENTS_TOPIC_ARN=arn:aws:sns:${AWS_REGION:-us-east-1}:000000000000:lynq-domain-events
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      lynq-iam:
        condition: service_started
      lynq-file-storage:
        condition: service_started

  lynq-bff:
    build: ./lynq-bff
    ports:
      - "8087:8080"
      - "8088:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - JWT_SECRET=${JWT_SECRET}
      - LYNQ_IAM_URL=http://lynq-iam:8080/lynq-iam
      - LYNQ_BACKEND_URL=http://lynq-app-backend:8080/lynq-backend-app
      - LYNQ_LLM_URL=http://lynq-llm:8084/lynq-llm
      - LYNQ_FILE_STORAGE_URL=http://lynq-file-storage:8080/lynq-file-storage
      - LYNQ_AGENT_URL=http://lynq-agent:8090/lynq-agent
      - LYNQ_ANALYTICS_URL=http://lynq-analytics:8080/lynq-analytics
    depends_on:
      lynq-iam:
        condition: service_started
      lynq-app-backend:
        condition: service_started
      lynq-file-storage:
        condition: service_started
      lynq-llm:
        condition: service_started
      lynq-agent:
        condition: service_started
      lynq-analytics:
        condition: service_started

  lynq-analytics:
    build: ./lynq-analytics
    ports:
      - "8091:8080"
      - "8092:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - DB_URL=jdbc:mysql://mysql:3306/lynq_analytics_db
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-testpassword123}
      - LYNQ_IAM_URL=http://lynq-iam:8080/lynq-iam
      - LYNQ_BACKEND_URL=http://lynq-app-backend:8080/lynq-backend-app
      - LYNQ_INTERNAL_TOKEN=${LYNQ_INTERNAL_TOKEN:-local-internal-token-not-a-secret}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - SPRING_CLOUD_AWS_SQS_ENDPOINT=${AWS_ENDPOINT:-http://localstack:4566}
      - LYNQ_ANALYTICS_EVENTS_QUEUE=lynq-analytics-events
      - REDIS_ADDRESS=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=${REDIS_USERNAME:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
      lynq-iam:
        condition: service_started

  lynq-app-frontend:
    build:
      context: ./lynq-app-frontend
      args:
        # The gateway is the only origin the SPA talks to: it relays the lynq-iam
        # auth endpoints, so there is no IAM URL to bake in.
        - LYNQ_BFF_BASE_URL=${LYNQ_BFF_BASE_URL:-http://localhost:8087/lynq-bff}
    ports:
      - "3000:8080"
    depends_on:
      - lynq-bff

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$${OLLAMA_MODEL}\""]
    restart: "no"

  lynq-llm:
    build: ./lynq-llm
    ports:
      - "8084:8084"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-300}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-}
      - BEDROCK_REGION=${BEDROCK_REGION:-us-east-1}
      - BEDROCK_MAX_TOKENS=${BEDROCK_MAX_TOKENS:-4096}
      - BEDROCK_TEMPERATURE=${BEDROCK_TEMPERATURE:-0}
      - BEDROCK_MAX_ATTEMPTS=${BEDROCK_MAX_ATTEMPTS:-3}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - LYNQ_IAM_URL=http://lynq-iam:8080/lynq-iam
      - LYNQ_IAM_TIMEOUT=${LYNQ_IAM_TIMEOUT:-10}
      - LYNQ_INTERNAL_TOKEN=${LYNQ_INTERNAL_TOKEN:-local-internal-token-not-a-secret}
      - PORT=8084
    depends_on:
      lynq-iam:
        condition: service_started
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/lynq-llm/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  lynq-feeders:
    build: ./lynq-feeders
    ports:
      - "8089:8089"
    environment:
      - PORT=8089
      - LYNQ_LLM_URL=http://lynq-llm:8084/lynq-llm
      - LYNQ_BACKEND_URL=http://lynq-app-backend:8080/lynq-backend-app
      - LYNQ_INTERNAL_TOKEN=${LYNQ_INTERNAL_TOKEN:-local-internal-token-not-a-secret}
      - LYNQ_FEEDERS_SYSTEM_USER_ID=${LYNQ_FEEDERS_SYSTEM_USER_ID:-00000000-0000-0000-0000-00000000feed}
      - FEEDER_CATEGORIES=${FEEDER_CATEGORIES:-ADMINISTRACION,TECNOLOGIA,CONTABILIDAD,RECURSOS_HUMANOS}
      - FEEDER_SOURCES=${FEEDER_SOURCES:-bumeran,computrabajo}
      - FEEDER_JOBS_PER_CATEGORY=${FEEDER_JOBS_PER_CATEGORY:-10}
      - LYNQ_LLM_CONCURRENCY=${LYNQ_LLM_CONCURRENCY:-2}
      - LYNQ_LLM_TIMEOUT=${LYNQ_LLM_TIMEOUT:-300}
    depends_on:
      lynq-app-backend:
        condition: service_started
      lynq-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8089/lynq-feeders/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  lynq-agent:
    build: ./lynq-agent
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - DB_URL=mysql+aiomysql://root:${DB_PASSWORD:-testpassword123}@mysql:3306/lynq_agent_db
      - DB_MIGRATE_ON_STARTUP=${DB_MIGRATE_ON_STARTUP:-true}
      - AGENT_HOUSEKEEPING_ENABLED=${AGENT_HOUSEKEEPING_ENABLED:-true}
      - AGENT_HOUSEKEEPING_INTERVAL=${AGENT_HOUSEKEEPING_INTERVAL:-3600}
      - AGENT_ABANDON_AFTER_DAYS=${AGENT_ABANDON_AFTER_DAYS:-7}
      - AGENT_TRACE_TTL_DAYS=${AGENT_TRACE_TTL_DAYS:-30}
      - AGENT_CONVERSATION_TTL_DAYS=${AGENT_CONVERSATION_TTL_DAYS:-180}
      - LYNQ_LLM_URL=http://lynq-llm:8084/lynq-llm
      - LYNQ_LLM_TIMEOUT=${LYNQ_LLM_TIMEOUT:-300}
      - LYNQ_IAM_URL=http://lynq-iam:8080/lynq-iam
      - LYNQ_IAM_TIMEOUT=${LYNQ_IAM_TIMEOUT:-10}
      # Both limits are parameterised so they can be dropped to 2 and exercised
      # without touching code (see the DoD items on the partial answer and on
      # EXHAUSTED). They are copied onto each conversation row at creation.
      - AGENT_MAX_STEPS=${AGENT_MAX_STEPS:-12}
      - AGENT_MAX_TURNS=${AGENT_MAX_TURNS:-10}
      # Read live from the settings, not copied onto the row: how many edits one
      # turn may apply before the tools answer EDIT LIMIT REACHED and the agent
      # recommends the rest instead of applying it.
      - AGENT_MAX_EDITS=${AGENT_MAX_EDITS:-2}
      # Bedrock answers ModelErrorException when the model emits a tool use it
      # cannot parse. It is intermittent, so the model call is retried before the
      # turn is given up on; every attempt costs a step.
      - AGENT_MODEL_RETRIES=${AGENT_MODEL_RETRIES:-2}
      # Operational, not part of the conversation contract: how long a turn may
      # stay RUNNING before it is treated as a dead process. Above the 310s
      # Feign read timeout in lynq-bff.
      - AGENT_TURN_TIMEOUT=${AGENT_TURN_TIMEOUT:-600}
      - AGENT_JOB_DESCRIPTION_MAX_CHARS=${AGENT_JOB_DESCRIPTION_MAX_CHARS:-6000}
      # Token prices are not configuration: src/llm/pricing.py keeps one tariff
      # per model and each conversation freezes the one in force when it was
      # created, so a price change never rewrites what an old conversation cost.
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-}
      - BEDROCK_REGION=${BEDROCK_REGION:-us-east-1}
      - BEDROCK_MAX_TOKENS=${BEDROCK_MAX_TOKENS:-4096}
      - BEDROCK_TEMPERATURE=${BEDROCK_TEMPERATURE:-0}
      - BEDROCK_GUARDRAIL_ID=${BEDROCK_GUARDRAIL_ID:-}
      - BEDROCK_GUARDRAIL_VERSION=${BEDROCK_GUARDRAIL_VERSION:-DRAFT}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      lynq-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/lynq-agent/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mysql:
    image: mysql:9.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-testpassword123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: gresau/localstack-persist:4.5
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sns,sqs
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-lynq-bucket}
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d:ro
      - localstack_data:/persisted-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command:
      - "redis-server"
      - "--user"
      - "default"
      - "off"
      - "--user"
      - "${REDIS_USERNAME:-root}"
      - "on"
      - ">${REDIS_PASSWORD:-password}"
      - "~*"
      - "&*"
      - "+@all"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "${REDIS_USERNAME:-root}", "-a", "${REDIS_PASSWORD:-password}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  localstack_data:
  ollama_data:
