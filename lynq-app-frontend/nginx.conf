server {
    # 8080 because the image runs nginx unprivileged (non-root can't bind 80).
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's bundled mime.types (1.27) has no entry for .mjs, so it would serve
    # the bundled pdf.js worker as application/octet-stream — and the browser
    # refuses an ES module with that type under strict MIME checking. react-pdf
    # then falls back to a "fake worker" and every PDF preview (the resume
    # wizard's, the translation's) fails to render. The include restates the
    # defaults, because a bare types block would replace the whole map.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    # SPA routing: fall back to index.html so client-side routes (react-router) work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
