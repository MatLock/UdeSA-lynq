<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- The LYNQ brand mark (same glyph as src/components/LynqLogo). Colors are
       inlined here rather than read from the logo tokens in index.css: a favicon
       is fetched by the browser outside the app, so no stylesheet applies.

       The light rounded plate is deliberate — on its own the navy bracket would
       disappear against a dark browser tab. -->
  <rect width="100" height="100" rx="20" fill="#f7f7f8" />
  <g transform="translate(50 50) scale(0.82) translate(-50 -50)">
    <g fill="none" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19.5 15.5V69.5H62" stroke="#0e2038" />
      <path d="M39 37.5H80.5V84.5" stroke="#4ac3ae" />
    </g>
    <circle cx="40" cy="52" r="5.8" fill="#4ac3ae" />
    <circle cx="60" cy="52" r="6.4" fill="#5045e5" />
  </g>
</svg>
