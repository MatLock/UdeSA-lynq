name: gitleaks

on:
  workflow_call:

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: "gitleaks: Secret scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan commits with gitleaks-action
        if: github.event_name != 'release'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gitleaks CLI
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --proto '=https' --proto-redir '=https' --retry 2 --retry-all-errors --max-time 300 -o "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" gitleaks

      - name: Scan full history with gitleaks CLI
        if: github.event_name == 'release'
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --verbose --no-banner \
            --report-format=sarif --report-path="$RUNNER_TEMP/gitleaks.sarif"

      - name: Upload gitleaks report
        if: failure() && github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: ${{ runner.temp }}/gitleaks.sarif
