name: dependency-check

on:
  workflow_call:

env:
  DEPENDENCY_CHECK_VERSION: 13.0.0
  DEPENDENCY_CHECK_SHA256: 44d920d1ec03e948df862a253f0912782a31b9beee8a7c8895b9cb95760176ed
  NVD_DATAFEED_URL: https://nvd.nist.gov/feeds/json/cve/2.0/nvdcve-2.0-{0}.json.gz
  FAIL_ON_CVSS: 7

jobs:
  dependency-check:
    name: "dependency-check: Vulnerable dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5

      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          architecture: x64
          cache: maven

      - name: Resolve Java runtime dependencies
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for module in lynq-iam lynq-app-backend lynq-file-storage lynq-bff lynq-analytics; do
            mvn -B -q -f "$module/pom.xml" dependency:copy-dependencies \
              -DincludeScope=runtime \
              -DoutputDirectory="$RUNNER_TEMP/dependency-check-scan/$module"
          done

      - name: Flatten Python lockfiles
        run: |
          set -euo pipefail
          for module in lynq-llm lynq-feeders lynq-agent; do
            mkdir -p "$RUNNER_TEMP/dependency-check-scan/$module"
            sed -E \
              -e '/^[[:space:]]*(#|-)/d' \
              -e 's/[[:space:]]*\\$//' \
              -e 's/[[:space:]]*;.*$//' \
              -e 's/\[[^]]*\]//' \
              -e 's/(==[0-9.]+)\.post[0-9]+$/\1/' \
              "$module/requirements.txt" > "$RUNNER_TEMP/dependency-check-scan/$module/requirements.txt"
          done

      - name: Install Dependency-Check CLI
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/dependency-check.zip"
          curl -sSfL --proto '=https' --proto-redir '=https' --retry 2 --retry-all-errors --max-time 300 -o "$ARCHIVE" \
            "https://github.com/dependency-check/DependencyCheck/releases/download/v${DEPENDENCY_CHECK_VERSION}/dependency-check-${DEPENDENCY_CHECK_VERSION}-release.zip"
          echo "${DEPENDENCY_CHECK_SHA256}  ${ARCHIVE}" | sha256sum -c -
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP"

      - name: Compute vulnerability database cache key
        id: cache-key
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore vulnerability database
        id: restore-db
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-feed-${{ env.DEPENDENCY_CHECK_VERSION }}-${{ steps.cache-key.outputs.date }}
          restore-keys: dependency-check-feed-${{ env.DEPENDENCY_CHECK_VERSION }}-

      - name: Update vulnerability database
        id: update-db
        timeout-minutes: 19
        continue-on-error: true
        run: |
          deadline=$(( $(date +%s) + 17 * 60 ))
          for attempt in 1 2 3; do
            remaining=$(( deadline - $(date +%s) ))
            if [ "$remaining" -lt 60 ]; then
              break
            fi
            if timeout "$remaining" "$RUNNER_TEMP/dependency-check/bin/dependency-check.sh" \
                --updateonly \
                --data "$RUNNER_TEMP/dependency-check-data" \
                --nvdDatafeed "$NVD_DATAFEED_URL"; then
              exit 0
            fi
            echo "::warning::NVD update attempt $attempt failed"
            sleep 15
          done
          echo "::warning::Could not update the NVD database; continuing without a fresh copy."
          exit 1

      - name: Skip Dependency-Check without a vulnerability database
        if: steps.update-db.outcome != 'success' && steps.restore-db.outputs.cache-matched-key == ''
        run: echo "::warning::No NVD database is available (update failed and nothing was cached); the dependency scan was skipped."

      - name: Run Dependency-Check
        if: steps.update-db.outcome == 'success' || steps.restore-db.outputs.cache-matched-key != ''
        timeout-minutes: 10
        run: |
          "$RUNNER_TEMP/dependency-check/bin/dependency-check.sh" \
            --project lynq \
            --scan "$RUNNER_TEMP/dependency-check-scan" \
            --scan lynq-app-frontend/package-lock.json \
            --data "$RUNNER_TEMP/dependency-check-data" \
            --noupdate \
            --enableExperimental \
            --disableOssIndex \
            --disableCentral \
            --nodeAuditSkipDevDependencies \
            --suppression dependency-check-suppressions.xml \
            --failOnCVSS "$FAIL_ON_CVSS" \
            --format HTML \
            --format SARIF \
            --out "$RUNNER_TEMP/dependency-check-report"

      - name: Save vulnerability database
        if: always() && steps.update-db.outcome == 'success' && steps.restore-db.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-feed-${{ env.DEPENDENCY_CHECK_VERSION }}-${{ steps.cache-key.outputs.date }}

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: ${{ runner.temp }}/dependency-check-report/
