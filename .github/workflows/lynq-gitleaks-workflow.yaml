name: gitleaks CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: "gitleaks"
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/gitleaks-workflow.yaml
