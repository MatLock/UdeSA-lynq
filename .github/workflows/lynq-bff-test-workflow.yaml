name: lynq-bff CI

on:
  push:
    branches: [main]
  pull_request:

# Two runs of this workflow must never push the badge at the same time;
# the older run's badge is stale anyway once a newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lynq-bff:
    name: "lynq-bff: Test & Coverage"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          architecture: x64
          cache: maven

      - name: Run tests with coverage
        working-directory: lynq-bff
        run: mvn -B clean verify

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-bff
          path: lynq-bff/target/site/jacoco/

      - name: Comment coverage on the PR
        if: always()
        uses: ./.github/actions/coverage-pr-comment
        with:
          module: lynq-bff
          icon: "🚪"
          language: java
          format: jacoco-csv
          path: lynq-bff/target/site/jacoco/jacoco.csv

      - name: Generate JaCoCo coverage badge
        if: github.ref == 'refs/heads/main'
        uses: cicirello/jacoco-badge-generator@72266185b7ee48a6fd74eaf0238395cc8b14fef8 # v2.12.1
        with:
          jacoco-csv-file: lynq-bff/target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-coverage-badge: true
          coverage-badge-filename: jacoco-bff.svg

      - name: Commit badge back to main
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/commit-to-main
        with:
          files: .github/badges/jacoco-bff.svg
          message: "chore: update bff coverage badge [skip ci]"
