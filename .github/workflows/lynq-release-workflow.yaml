name: lynq CICD [Releases]

on:
  release:
    types: [published]

env:
  # Single Docker Hub repository shared by all services; each service is
  # distinguished by a tag prefix, e.g. matlock0o/lynq:lynq-ml-<version>.
  DOCKER_NAMESPACE: matlock0o/lynq

jobs:
  # ===========================================================================
  # Stage 1 — Stamp the release tag into every project's version metadata and
  # commit it back to main so the built artifacts and images carry the version.
  # ===========================================================================
  set-version:
    name: "1 · Set release version"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          architecture: x64
          cache: maven

      - name: Resolve version from tag
        id: resolve
        run: |
          # Strip an optional leading "v" so poms carry a clean semver value.
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#refs/tags/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $VERSION"

      - name: Bump lynq-iam pom version
        working-directory: lynq-iam
        run: mvn -B versions:set -DnewVersion="${{ steps.resolve.outputs.version }}" -DgenerateBackupPoms=false

      - name: Bump lynq-app-backend pom version
        working-directory: lynq-app-backend
        run: mvn -B versions:set -DnewVersion="${{ steps.resolve.outputs.version }}" -DgenerateBackupPoms=false

      - name: Bump lynq-file-storage pom version
        working-directory: lynq-file-storage
        run: mvn -B versions:set -DnewVersion="${{ steps.resolve.outputs.version }}" -DgenerateBackupPoms=false

      - name: Bump lynq-ml (python) version
        run: echo "${{ steps.resolve.outputs.version }}" > lynq-ml/VERSION

      - name: Bump Helm chart appVersion
        run: |
          # Mirror the released tag into the Helm chart's appVersion, matching
          # how the poms are stamped. appVersion is quoted so values like
          # "1.0.5-SNAPSHOT" stay valid YAML.
          sed -i -E "s/^appVersion:.*/appVersion: \"${{ steps.resolve.outputs.version }}\"/" infrastructure/helm/Chart.yaml

      - name: Generate version badge
        run: |
          mkdir -p .github/badges
          # Use the static/v1 endpoint with URL-encoded params so versions that
          # contain characters special to the "label-message-color" path syntax
          # (e.g. the hyphen in "1.0.4-SNAPSHOT") don't produce a "404: badge not
          # found" placeholder.
          curl -sSL --proto '=https' --proto-redir '=https' --fail -G \
            --data-urlencode "label=lynq-latest-version" \
            --data-urlencode "message=${{ steps.resolve.outputs.version }}" \
            --data-urlencode "color=blue" \
            "https://img.shields.io/static/v1" \
            -o .github/badges/version.svg

      - name: Commit version bump back to main
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore: set release version ${{ steps.resolve.outputs.version }} [skip ci]"
          file_pattern: lynq-iam/pom.xml lynq-app-backend/pom.xml lynq-file-storage/pom.xml lynq-ml/VERSION infrastructure/helm/Chart.yaml .github/badges/version.svg

  # ===========================================================================
  # Stage 2 — Build & test each service in parallel. Artifacts (jars + JaCoCo
  # reports) are handed off to the later stages instead of rebuilding.
  # ===========================================================================
  build-lynq-iam:
    name: "2 · Build & test: lynq-iam"
    runs-on: ubuntu-latest
    needs: set-version
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          architecture: x64
          cache: maven

      - name: Build and run tests
        working-directory: lynq-iam
        run: mvn -B clean verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: lynq-iam-jar
          path: lynq-iam/target/lynq-iam.jar

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-lynq-iam
          path: lynq-iam/target/site/jacoco/

  build-lynq-app-backend:
    name: "2 · Build & test: lynq-app-backend"
    runs-on: ubuntu-latest
    needs: set-version
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          architecture: x64
          cache: maven

      - name: Build and run tests
        working-directory: lynq-app-backend
        run: mvn -B clean verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: lynq-app-backend-jar
          path: lynq-app-backend/target/lynq-app-backend.jar

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-lynq-app-backend
          path: lynq-app-backend/target/site/jacoco/

  build-lynq-file-storage:
    name: "2 · Build & test: lynq-file-storage"
    runs-on: ubuntu-latest
    needs: set-version
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          architecture: x64
          cache: maven

      - name: Build and run tests
        working-directory: lynq-file-storage
        run: mvn -B clean verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: lynq-file-storage-jar
          path: lynq-file-storage/target/lynq-file-storage.jar

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-lynq-file-storage
          path: lynq-file-storage/target/site/jacoco/

  build-lynq-ml:
    name: "2 · Build & test: lynq-ml"
    runs-on: ubuntu-latest
    needs: set-version
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: lynq-ml
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          # requirements.txt is a full lock (pip-compile --generate-hashes from
          # requirements.in); --require-hashes makes the install reproducible.
          pip install --require-hashes --only-binary :all: -r requirements.txt
          pip install --only-binary :all: "coverage==7.15.2"

      - name: Run tests
        working-directory: lynq-ml
        run: |
          coverage run --branch -m unittest discover -s tests -t .
          coverage report -m
          coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lynq-ml
          path: lynq-ml/coverage.xml

  # ===========================================================================
  # Stage 3 — Run a SonarCloud analysis of the whole monorepo right after the
  # tests pass and BEFORE any image is built. The Quality Gate is blocking: a
  # red gate fails this job, so the image push (stage 4) never runs and the
  # release is stopped. On success the results are captured for the notes.
  # ===========================================================================
  sonar-scan:
    name: "3 · SonarCloud analysis (Quality Gate)"
    runs-on: ubuntu-latest
    needs: [set-version, build-lynq-iam, build-lynq-app-backend, build-lynq-file-storage, build-lynq-ml]
    outputs:
      gate: ${{ steps.results.outputs.gate }}
      bugs: ${{ steps.results.outputs.bugs }}
      vulnerabilities: ${{ steps.results.outputs.vulnerabilities }}
      code_smells: ${{ steps.results.outputs.code_smells }}
      security_hotspots: ${{ steps.results.outputs.security_hotspots }}
      reliability_rating: ${{ steps.results.outputs.reliability_rating }}
      security_rating: ${{ steps.results.outputs.security_rating }}
      maintainability_rating: ${{ steps.results.outputs.maintainability_rating }}
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          architecture: x64
          cache: maven

      - name: Compile Java modules for analysis
        run: |
          # The Java sensor needs compiled classes (sonar.java.binaries). Compile
          # only — tests already ran in stage 2, so skip them here for speed.
          mvn -B -q -f lynq-iam/pom.xml clean test-compile
          mvn -B -q -f lynq-app-backend/pom.xml clean test-compile
          mvn -B -q -f lynq-file-storage/pom.xml clean test-compile

      # Reuse the coverage reports produced by stage 2 (paths declared in
      # sonar-project.properties). Without them SonarCloud reports 0% coverage
      # and the Quality Gate's "Coverage on New Code" condition always fails.
      # Downloaded after the compile step because `mvn clean` wipes target/.
      - name: Download lynq-iam coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-lynq-iam
          path: lynq-iam/target/site/jacoco

      - name: Download lynq-app-backend coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-lynq-app-backend
          path: lynq-app-backend/target/site/jacoco

      - name: Download lynq-file-storage coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-lynq-file-storage
          path: lynq-file-storage/target/site/jacoco

      - name: Download lynq-ml coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-lynq-ml
          path: lynq-ml

      - name: Point lynq-ml coverage at this workspace
        run: |
          # coverage.xml records the absolute source path of the runner that
          # produced it; rewrite it so the scanner resolves the files here.
          sed -i -E "s|<source>.*</source>|<source>${GITHUB_WORKSPACE}/lynq-ml</source>|" lynq-ml/coverage.xml

      - name: Verify coverage reports are present
        run: |
          # A missing report makes the scanner report 0% coverage silently and
          # the Quality Gate then fails on "Coverage on New Code" with no clue
          # as to why. Fail here instead, with the actual missing path.
          missing=0
          for f in lynq-iam/target/site/jacoco/jacoco.xml \
                   lynq-app-backend/target/site/jacoco/jacoco.xml \
                   lynq-file-storage/target/site/jacoco/jacoco.xml \
                   lynq-ml/coverage.xml; do
            if [ -s "$f" ]; then
              echo "✓ $f"
            else
              echo "✗ missing or empty: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || {
            echo "::error::Coverage reports missing; SonarCloud would report 0% coverage."
            exit 1
          }

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # projectVersion is what the "previous_version" New Code definition
          # compares against; without it every analysis is version
          # "not provided" and the leak period never advances past the first
          # analysis, so New Code keeps growing across releases.
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.projectVersion=${{ needs.set-version.outputs.version }}

      - name: Fetch Quality Gate and measures
        id: results
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_KEY: MatLock_UdeSA-lynq
        run: |
          BASE="https://sonarcloud.io"
          curl -sSL --proto '=https' --proto-redir '=https' -u "$SONAR_TOKEN:" \
            "$BASE/api/qualitygates/project_status?projectKey=$PROJECT_KEY" -o /tmp/gate.json
          curl -sSL --proto '=https' --proto-redir '=https' -u "$SONAR_TOKEN:" \
            "$BASE/api/measures/component?component=$PROJECT_KEY&metricKeys=bugs,vulnerabilities,code_smells,security_hotspots,reliability_rating,security_rating,sqale_rating" \
            -o /tmp/measures.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          gate = json.load(open('/tmp/gate.json')).get('projectStatus', {}).get('status', 'NONE')
          measures = {m['metric']: m['value']
                      for m in json.load(open('/tmp/measures.json')).get('component', {}).get('measures', [])}
          letter = {'1.0': 'A', '2.0': 'B', '3.0': 'C', '4.0': 'D', '5.0': 'E'}
          def rating(k): return letter.get(measures.get(k, ''), 'n/a')
          print(f"gate={gate}")
          print(f"bugs={measures.get('bugs', 'n/a')}")
          print(f"vulnerabilities={measures.get('vulnerabilities', 'n/a')}")
          print(f"code_smells={measures.get('code_smells', 'n/a')}")
          print(f"security_hotspots={measures.get('security_hotspots', 'n/a')}")
          print(f"reliability_rating={rating('reliability_rating')}")
          print(f"security_rating={rating('security_rating')}")
          print(f"maintainability_rating={rating('sqale_rating')}")
          PY

  # ===========================================================================
  # Stage 4 — Build the Docker images from the tested artifacts and push them
  # to Docker Hub. Runs only after the Quality Gate has passed.
  # ===========================================================================
  push-images:
    name: "4 · Push Docker images"
    runs-on: ubuntu-latest
    needs: [set-version, build-lynq-iam, build-lynq-app-backend, build-lynq-file-storage, build-lynq-ml, sonar-scan]
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Download lynq-iam jar
        uses: actions/download-artifact@v4
        with:
          name: lynq-iam-jar
          path: lynq-iam/target

      - name: Download lynq-app-backend jar
        uses: actions/download-artifact@v4
        with:
          name: lynq-app-backend-jar
          path: lynq-app-backend/target

      - name: Download lynq-file-storage jar
        uses: actions/download-artifact@v4
        with:
          name: lynq-file-storage-jar
          path: lynq-file-storage/target

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push lynq-iam image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: lynq-iam
          file: lynq-iam/Dockerfile
          push: true
          tags: ${{ env.DOCKER_NAMESPACE }}:lynq-iam-${{ needs.set-version.outputs.version }}

      - name: Build and push lynq-app-backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: lynq-app-backend
          file: lynq-app-backend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_NAMESPACE }}:lynq-app-backend-${{ needs.set-version.outputs.version }}

      - name: Build and push lynq-file-storage image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: lynq-file-storage
          file: lynq-file-storage/Dockerfile
          push: true
          tags: ${{ env.DOCKER_NAMESPACE }}:lynq-file-storage-${{ needs.set-version.outputs.version }}

      - name: Build and push lynq-ml image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: lynq-ml
          file: lynq-ml/Dockerfile
          push: true
          tags: ${{ env.DOCKER_NAMESPACE }}:lynq-ml-${{ needs.set-version.outputs.version }}

      - name: Build and push lynq-app-frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: lynq-app-frontend
          file: lynq-app-frontend/Dockerfile
          push: true
          build-args: |
            LYNQ_IAM_BASE_URL=http://lynq.local/lynq-iam
            LYNQ_BACKEND_BASE_URL=http://lynq.local/lynq-backend-app
          tags: ${{ env.DOCKER_NAMESPACE }}:lynq-app-frontend-${{ needs.set-version.outputs.version }}

  # ===========================================================================
  # Stage 5 — Publish the JaCoCo coverage produced in stage 2 and the SonarCloud
  # results from stage 3 into the release notes, and attach the HTML reports.
  # Runs after the images are published.
  # ===========================================================================
  publish-coverage:
    name: "5 · Publish coverage & Sonar to release notes"
    runs-on: ubuntu-latest
    needs: [push-images, sonar-scan]
    permissions:
      contents: write
    steps:
      - name: Download lynq-iam coverage
        uses: actions/download-artifact@v4
        with:
          name: jacoco-lynq-iam
          path: coverage/lynq-iam

      - name: Download lynq-app-backend coverage
        uses: actions/download-artifact@v4
        with:
          name: jacoco-lynq-app-backend
          path: coverage/lynq-app-backend

      - name: Download lynq-file-storage coverage
        uses: actions/download-artifact@v4
        with:
          name: jacoco-lynq-file-storage
          path: coverage/lynq-file-storage

      - name: Download lynq-ml coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-lynq-ml
          path: coverage/lynq-ml

      - name: Extract coverage percentages
        id: coverage
        run: |
          # JaCoCo (Java): sum missed/covered counters from the CSV report.
          extract_jacoco() {
            awk -F',' '
              NR>1 { im+=$4; ic+=$5; bm+=$6; bc+=$7; lm+=$8; lc+=$9; }
              END {
                printf "%.2f %.2f %.2f",
                  (ic/(im+ic))*100,
                  (lc/(lm+lc))*100,
                  (bm+bc>0 ? (bc/(bm+bc))*100 : 0);
              }' "$1"
          }
          # coverage.py (Python): read line-rate/branch-rate from the Cobertura XML.
          rate() {
            python3 -c "import xml.etree.ElementTree as ET; print(f\"{float(ET.parse('$1').getroot().get('$2'))*100:.2f}\")"
          }
          read IAM_INSTR IAM_LINE IAM_BRANCH <<<"$(extract_jacoco coverage/lynq-iam/jacoco.csv)"
          read APP_INSTR APP_LINE APP_BRANCH <<<"$(extract_jacoco coverage/lynq-app-backend/jacoco.csv)"
          read FS_INSTR FS_LINE FS_BRANCH <<<"$(extract_jacoco coverage/lynq-file-storage/jacoco.csv)"
          ML_LINE="$(rate coverage/lynq-ml/coverage.xml line-rate)"
          ML_BRANCH="$(rate coverage/lynq-ml/coverage.xml branch-rate)"
          {
            echo "iam_instruction=$IAM_INSTR"
            echo "iam_line=$IAM_LINE"
            echo "iam_branch=$IAM_BRANCH"
            echo "app_instruction=$APP_INSTR"
            echo "app_line=$APP_LINE"
            echo "app_branch=$APP_BRANCH"
            echo "fs_instruction=$FS_INSTR"
            echo "fs_line=$FS_LINE"
            echo "fs_branch=$FS_BRANCH"
            echo "ml_line=$ML_LINE"
            echo "ml_branch=$ML_BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Append coverage & Sonar summary to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          IAM_INSTR: ${{ steps.coverage.outputs.iam_instruction }}
          IAM_LINE: ${{ steps.coverage.outputs.iam_line }}
          IAM_BRANCH: ${{ steps.coverage.outputs.iam_branch }}
          APP_INSTR: ${{ steps.coverage.outputs.app_instruction }}
          APP_LINE: ${{ steps.coverage.outputs.app_line }}
          APP_BRANCH: ${{ steps.coverage.outputs.app_branch }}
          FS_INSTR: ${{ steps.coverage.outputs.fs_instruction }}
          FS_LINE: ${{ steps.coverage.outputs.fs_line }}
          FS_BRANCH: ${{ steps.coverage.outputs.fs_branch }}
          ML_LINE: ${{ steps.coverage.outputs.ml_line }}
          ML_BRANCH: ${{ steps.coverage.outputs.ml_branch }}
          SONAR_GATE: ${{ needs.sonar-scan.outputs.gate }}
          SONAR_BUGS: ${{ needs.sonar-scan.outputs.bugs }}
          SONAR_VULNS: ${{ needs.sonar-scan.outputs.vulnerabilities }}
          SONAR_SMELLS: ${{ needs.sonar-scan.outputs.code_smells }}
          SONAR_HOTSPOTS: ${{ needs.sonar-scan.outputs.security_hotspots }}
          SONAR_REL: ${{ needs.sonar-scan.outputs.reliability_rating }}
          SONAR_SEC: ${{ needs.sonar-scan.outputs.security_rating }}
          SONAR_MAINT: ${{ needs.sonar-scan.outputs.maintainability_rating }}
        run: |
          case "$SONAR_GATE" in
            OK)    GATE_LABEL='✅ Passed' ;;
            ERROR) GATE_LABEL='❌ Failed' ;;
            *)     GATE_LABEL="$SONAR_GATE" ;;
          esac
          existing=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body)
          {
            printf '%s\n\n' "$existing"
            printf '%s\n\n' '---'
            printf '## Code quality (SonarCloud)\n\n'
            printf '**Quality Gate: %s** — [full report](https://sonarcloud.io/summary/new_code?id=MatLock_UdeSA-lynq)\n\n' "$GATE_LABEL"
            printf '| Metric | Value | Rating |\n'
            printf '| --- | --- | --- |\n'
            printf '| Bugs | %s | %s |\n' "$SONAR_BUGS" "$SONAR_REL"
            printf '| Vulnerabilities | %s | %s |\n' "$SONAR_VULNS" "$SONAR_SEC"
            printf '| Code smells | %s | %s |\n' "$SONAR_SMELLS" "$SONAR_MAINT"
            printf '| Security hotspots | %s | — |\n\n' "$SONAR_HOTSPOTS"
            printf '## Test coverage (lynq-iam)\n\n'
            printf '| Metric | Coverage |\n'
            printf '| --- | --- |\n'
            printf '| Instructions | %s%% |\n' "$IAM_INSTR"
            printf '| Lines | %s%% |\n' "$IAM_LINE"
            printf '| Branches | %s%% |\n\n' "$IAM_BRANCH"
            printf '## Test coverage (lynq-app-backend)\n\n'
            printf '| Metric | Coverage |\n'
            printf '| --- | --- |\n'
            printf '| Instructions | %s%% |\n' "$APP_INSTR"
            printf '| Lines | %s%% |\n' "$APP_LINE"
            printf '| Branches | %s%% |\n\n' "$APP_BRANCH"
            printf '## Test coverage (lynq-file-storage)\n\n'
            printf '| Metric | Coverage |\n'
            printf '| --- | --- |\n'
            printf '| Instructions | %s%% |\n' "$FS_INSTR"
            printf '| Lines | %s%% |\n' "$FS_LINE"
            printf '| Branches | %s%% |\n\n' "$FS_BRANCH"
            printf '## Test coverage (lynq-ml)\n\n'
            printf '| Metric | Coverage |\n'
            printf '| --- | --- |\n'
            printf '| Lines | %s%% |\n' "$ML_LINE"
            printf '| Branches | %s%% |\n' "$ML_BRANCH"
          } > /tmp/notes.md
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file /tmp/notes.md

      - name: Attach JaCoCo HTML reports to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          (cd coverage/lynq-iam && zip -qr /tmp/jacoco-report-iam.zip .)
          (cd coverage/lynq-app-backend && zip -qr /tmp/jacoco-report-app-backend.zip .)
          (cd coverage/lynq-file-storage && zip -qr /tmp/jacoco-report-file-storage.zip .)
          cp coverage/lynq-ml/coverage.xml /tmp/coverage-lynq-ml.xml
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" /tmp/jacoco-report-iam.zip --clobber
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" /tmp/jacoco-report-app-backend.zip --clobber
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" /tmp/jacoco-report-file-storage.zip --clobber
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" /tmp/coverage-lynq-ml.xml --clobber

  # ===========================================================================
  # Stage 6 — Point the Helm values at the images just built and pushed in
  # stage 4. The chart's appVersion was already stamped in stage 1, but the
  # per-service image tags in the values files are pinned literally, so they
  # are rewritten here to the released version and committed back to main. This
  # includes the local frontend image (published only for local testing; the
  # prod values carry no frontend image, so nothing matches there).
  # ===========================================================================
  sync-helm-images:
    name: "6 · Sync Helm image tags to release"
    runs-on: ubuntu-latest
    needs: [set-version, publish-coverage]
    permissions:
      contents: write
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Point Helm image tags at the released version
        env:
          VERSION: ${{ needs.set-version.outputs.version }}
        run: |
          # Each published service shares the DOCKER_NAMESPACE repo and is
          # tagged <service>-<version>. Rewrite the tag suffix of every managed
          # image in both values files to the version pushed in stage 4.
          for f in infrastructure/helm/values/k8s_values-local.yaml \
                   infrastructure/helm/values/k8s_values-prod.yaml; do
            sed -i -E "s#(image: ${DOCKER_NAMESPACE}:lynq-(iam|app-backend|app-frontend|file-storage|ml)-).*#\1${VERSION}#" "$f"
          done

      - name: Commit Helm image tag bump to main
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore: point Helm image tags at release ${{ needs.set-version.outputs.version }} [skip ci]"
          file_pattern: infrastructure/helm/values/k8s_values-local.yaml infrastructure/helm/values/k8s_values-prod.yaml

  # ===========================================================================
  # Stage 7 — Once the release is fully published, open the next development
  # cycle by bumping every project's version one step higher and committing it
  # back to main. A released SNAPSHOT bumps the patch (1.0.5-SNAPSHOT ->
  # 1.0.6-SNAPSHOT); a released final version bumps the minor and resets the
  # patch (1.0.5 -> 1.1.0-SNAPSHOT).
  # ===========================================================================
  bump-next-version:
    name: "7 · Bump to next development version"
    runs-on: ubuntu-latest
    needs: [set-version, sync-helm-images]
    permissions:
      contents: write
    steps:
      - name: Code Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          architecture: x64
          cache: maven

      - name: Compute next development version
        id: next
        env:
          VERSION: ${{ needs.set-version.outputs.version }}
        run: |
          # Split the released version into its base (MAJOR.MINOR.PATCH) and the
          # optional -SNAPSHOT suffix.
          BASE="${VERSION%-SNAPSHOT}"
          IFS='.' read -r MAJOR MINOR PATCH <<<"$BASE"
          if [ "$BASE" != "$VERSION" ]; then
            # Released a SNAPSHOT (e.g. 1.0.5-SNAPSHOT) -> bump patch -> 1.0.6-SNAPSHOT
            PATCH=$((PATCH + 1))
          else
            # Released a final version (e.g. 1.0.5) -> bump minor, reset patch -> 1.1.0-SNAPSHOT
            MINOR=$((MINOR + 1))
            PATCH=0
          fi
          NEXT="${MAJOR}.${MINOR}.${PATCH}-SNAPSHOT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next development version: $NEXT"

      - name: Bump lynq-iam pom version
        working-directory: lynq-iam
        run: mvn -B versions:set -DnewVersion="${{ steps.next.outputs.version }}" -DgenerateBackupPoms=false

      - name: Bump lynq-app-backend pom version
        working-directory: lynq-app-backend
        run: mvn -B versions:set -DnewVersion="${{ steps.next.outputs.version }}" -DgenerateBackupPoms=false

      - name: Bump lynq-file-storage pom version
        working-directory: lynq-file-storage
        run: mvn -B versions:set -DnewVersion="${{ steps.next.outputs.version }}" -DgenerateBackupPoms=false

      - name: Bump lynq-ml (python) version
        run: echo "${{ steps.next.outputs.version }}" > lynq-ml/VERSION

      - name: Bump Helm chart appVersion
        run: |
          sed -i -E "s/^appVersion:.*/appVersion: \"${{ steps.next.outputs.version }}\"/" infrastructure/helm/Chart.yaml

      - name: Commit next development version to main
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore: prepare next development version ${{ steps.next.outputs.version }} [skip ci]"
          file_pattern: lynq-iam/pom.xml lynq-app-backend/pom.xml lynq-file-storage/pom.xml lynq-ml/VERSION infrastructure/helm/Chart.yaml
