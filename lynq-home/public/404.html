<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>LYNQ — Página no encontrada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..900,30..100&family=DM+Sans:opsz,wght@9..40,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efe9dc;
    --ink: #0e0e0c;
    --ink-soft: #45433d;
    --line: #c9c2b3;
    --accent: #c6f432;
    --warm: #c63f1a;
    --serif: "Fraunces", "Times New Roman", serif;
    --sans: "DM Sans", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --pad: clamp(24px, 5vw, 80px);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: var(--sans);
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px var(--pad);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 22px;
    letter-spacing: -.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px var(--ink);
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
    padding: 64px var(--pad);
    max-width: 960px;
  }
  .label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .code {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(120px, 26vw, 280px);
    line-height: .85;
    letter-spacing: -.05em;
  }
  .code em { font-style: italic; color: var(--warm); }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(28px, 4.5vw, 48px);
    line-height: 1.1;
    letter-spacing: -.02em;
  }
  p { max-width: 52ch; color: var(--ink-soft); font-size: 18px; }
  .actions { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-top: 8px; }
  .btn-primary {
    background: var(--ink);
    color: var(--bg);
    padding: 18px 28px;
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    transition: transform .2s, background .2s;
  }
  .btn-primary:hover { background: var(--warm); transform: translateY(-2px); }
  .btn-ghost {
    padding: 18px 4px;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--ink);
  }
</style>
</head>
<body>
<nav>
  <a href="/" class="brand"><span class="brand-dot"></span>LYNQ</a>
</nav>
<main>
  <span class="label">Error 404 / Página no encontrada</span>
  <div class="code">4<em>0</em>4</div>
  <h1>LYNQ no encontró esta página.</h1>
  <p>La dirección que buscás no existe o cambió de lugar.</p>
  <div class="actions">
    <a href="/" class="btn-primary">Volver al inicio</a>
    <a href="https://app.lynqoficial.com" class="btn-ghost">Ir a la App →</a>
  </div>
</main>
</body>
</html>
