sonar.projectName=UdeSA-lynq
sonar.sources=.
sonar.java.source=21
sonar.java.binaries=lynq-iam/target/classes,lynq-app-backend/target/classes,lynq-file-storage/target/classes,lynq-bff/target/classes,lynq-analytics/target/classes
sonar.java.test.binaries=lynq-iam/target/test-classes,lynq-app-backend/target/test-classes,lynq-file-storage/target/test-classes,lynq-bff/target/test-classes,lynq-analytics/target/test-classes
sonar.python.version=3.12
# Every .sql here is MySQL (Liquibase changesets, init and backfill scripts), but
# SonarCloud only ships Oracle PL/SQL and T-SQL analyzers, so it reports MySQL-valid
# syntax as bugs (plsql:CharVarchar on CHAR(36) UUID keys, for instance).
sonar.exclusions=**/*.sql,**/target/**,**/node_modules/**,**/dist/**,**/build/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/*.min.js,**/*.min.css,**/src/test/**,lynq-llm/tests/**,lynq-feeders/tests/**,lynq-agent/tests/**,tools/seed/tests/**,lynq-app-frontend/src/i18n/locales/**
sonar.tests=lynq-iam/src/test,lynq-app-backend/src/test,lynq-file-storage/src/test,lynq-bff/src/test,lynq-analytics/src/test,lynq-llm/tests,lynq-feeders/tests,lynq-agent/tests,tools/seed/tests
sonar.coverage.jacoco.xmlReportPaths=lynq-iam/target/site/jacoco/jacoco.xml,lynq-app-backend/target/site/jacoco/jacoco.xml,lynq-file-storage/target/site/jacoco/jacoco.xml,lynq-bff/target/site/jacoco/jacoco.xml,lynq-analytics/target/site/jacoco/jacoco.xml
sonar.python.coverage.reportPaths=lynq-llm/coverage.xml,lynq-feeders/coverage.xml,lynq-agent/coverage.xml
# selenium_tests holds the E2E driver scripts and tools holds local dev scripts (the
# demo seed); neither runs in CI, so neither produces a coverage report,
# and both would otherwise count as uncovered new code.
sonar.coverage.exclusions=lynq-app-frontend/**,lynq-home/**,selenium_tests/**,tools/**
# Each service is an independently deployable Maven project with no shared parent,
# so this cross-cutting infrastructure boilerplate is intentionally repeated per service.
sonar.cpd.exclusions=**/controller/handler/ControllerExceptionHandler.java,**/aspect/LogAspect.java,**/filter/RequestUuidFilter.java,**/filter/AuthHeaderExistenceFilter.java,**/filter/PublicPaths.java,**/filter/InternalTokenFilter.java,**/filter/IamAuthenticationFilter.java,**/config/SecurityConfig.java,**/security/LynqUserPrincipal.java,**/security/Role.java,**/security/HasRole.java,lynq-llm/src/security/__init__.py,lynq-agent/src/security/__init__.py
