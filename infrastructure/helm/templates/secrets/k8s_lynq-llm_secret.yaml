{{- if .Values.manageSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: lynq-llm-secret
  namespace: lynq-{{ .Values.k8s_namespace }}-namespace
  labels:
    app: lynq-llm
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.credentials.bedrock.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.credentials.bedrock.secretAccessKey | quote }}
  # Same value as lynq-feeders-secret: the feeder presents it on /internal/**,
  # this service checks it. Its /dmz routes want an access token instead.
  LYNQ_INTERNAL_TOKEN: {{ .Values.credentials.internal.token | quote }}
{{- end }}
