{{- if .Values.manageSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: lynq-analytics-secret
  namespace: lynq-{{ .Values.k8s_namespace }}-namespace
  labels:
    app: lynq-analytics
type: Opaque
stringData:
  DB_USERNAME: {{ .Values.credentials.db.username | quote }}
  DB_PASSWORD: {{ .Values.credentials.db.password | quote }}
  REDIS_USERNAME: {{ .Values.credentials.redis.username | quote }}
  REDIS_PASSWORD: {{ .Values.credentials.redis.password | quote }}
  # Same value as lynq-app-backend-secret: the snapshot CronJob presents it to this
  # service, and this service presents it to lynq-app-backend's /internal/score/batch.
  LYNQ_INTERNAL_TOKEN: {{ .Values.credentials.internal.token | quote }}
{{- end }}
