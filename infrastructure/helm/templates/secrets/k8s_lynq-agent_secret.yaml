{{- if .Values.manageSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: lynq-agent-secret
  namespace: lynq-{{ .Values.k8s_namespace }}-namespace
  labels:
    app: lynq-agent
type: Opaque
stringData:
  # The agent takes one SQLAlchemy URL rather than a username/password pair, so
  # the whole URL carries the password and belongs here and not in the ConfigMap.
  DB_URL: mysql+aiomysql://{{ .Values.credentials.db.username }}:{{ .Values.credentials.db.password }}@{{ .Values.lynq_agent.dbHost }}:3306/lynq_agent_db
  AWS_ACCESS_KEY_ID: {{ .Values.credentials.bedrock.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.credentials.bedrock.secretAccessKey | quote }}
{{- end }}
