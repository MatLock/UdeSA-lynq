apiVersion: apps/v1
kind: Deployment
metadata:
  name: lynq-feeders-deployment
  namespace: lynq-{{ .Values.k8s_namespace }}-namespace
  labels:
    app: lynq-feeders
spec:
  replicas: {{ .Values.lynq_feeders.replicas }}
  selector:
    matchLabels:
      app: lynq-feeders
  template:
    metadata:
      labels:
        app: lynq-feeders
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      {{- if .Values.localInfra }}
      # Local only: the feeder is useless until the service that owns the database is up.
      initContainers:
        - name: wait-for-app-backend
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -w 2 lynq-app-backend-service 8080 </dev/null; do echo "waiting for lynq-app-backend-service:8080"; sleep 2; done']
      {{- end }}
      containers:
        - name: lynq-feeders
          image: {{ .Values.lynq_feeders.image }}
          {{- with .Values.lynq_feeders.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: lynq-feeders-config
            - secretRef:
                name: lynq-feeders-secret
          ports:
            - name: http
              containerPort: 8089
          livenessProbe:
            httpGet:
              path: /lynq-feeders/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /lynq-feeders/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
