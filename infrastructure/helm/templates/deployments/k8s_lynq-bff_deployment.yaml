apiVersion: apps/v1
kind: Deployment
metadata:
  name: lynq-bff-deployment
  namespace: lynq-{{ .Values.k8s_namespace }}-namespace
  labels:
    app: lynq-bff
spec:
  replicas: {{ .Values.lynq_bff.replicas }}
  selector:
    matchLabels:
      app: lynq-bff
  template:
    metadata:
      labels:
        app: lynq-bff
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      {{- if .Values.localInfra }}
      # Local only: wait for the in-cluster dependencies before starting.
      initContainers:
        - name: wait-for-app-backend
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -w 2 lynq-app-backend-service 8080 </dev/null; do echo "waiting for lynq-app-backend-service:8080"; sleep 2; done']
        - name: wait-for-file-storage
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -w 2 lynq-file-storage-service 8080 </dev/null; do echo "waiting for lynq-file-storage-service:8080"; sleep 2; done']
        - name: wait-for-ml
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -w 2 lynq-ml-service 8084 </dev/null; do echo "waiting for lynq-ml-service:8084"; sleep 2; done']
      {{- end }}
      containers:
        - name: lynq-bff
          image: {{ .Values.lynq_bff.image }}
          envFrom:
            - configMapRef:
                name: lynq-bff-config
            - secretRef:
                name: lynq-bff-secret
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
