{{- if .Values.localFrontend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lynq-app-frontend
  namespace: lynq-{{ .Values.k8s_namespace }}-namespace
  labels:
    app: lynq-app-frontend
spec:
  replicas: {{ .Values.lynq_app_frontend.replicas }}
  selector:
    matchLabels:
      app: lynq-app-frontend
  template:
    metadata:
      labels:
        app: lynq-app-frontend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: lynq-app-frontend
          image: {{ .Values.lynq_app_frontend.image }}
          # Defaults to the image published per release (local ingress URLs baked
          # in). IfNotPresent so an override to a locally-built/loaded image (e.g.
          # lynq-app-frontend:local via `minikube image load`) is used as-is.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              # 8080 because the image runs nginx unprivileged (non-root).
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
{{- end }}
