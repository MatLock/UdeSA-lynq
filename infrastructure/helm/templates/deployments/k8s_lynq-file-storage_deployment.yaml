apiVersion: apps/v1
kind: Deployment
metadata:
  name: lynq-file-storage-deployment
  namespace: lynq-{{ .Values.k8s_namespace }}-namespace
  labels:
    app: lynq-file-storage
spec:
  replicas: {{ .Values.lynq_file_storage.replicas }}
  selector:
    matchLabels:
      app: lynq-file-storage
  template:
    metadata:
      labels:
        app: lynq-file-storage
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      {{- if .Values.localInfra }}
      # Local only: wait for the in-cluster dependencies before starting. This is
      # the only service that talks to the bucket, so it is the only one waiting
      # on LocalStack.
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -w 2 mysql 3306 </dev/null; do echo "waiting for mysql:3306"; sleep 2; done']
        - name: wait-for-localstack
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -w 2 localstack 4566 </dev/null; do echo "waiting for localstack:4566"; sleep 2; done']
      {{- end }}
      containers:
        - name: lynq-file-storage
          image: {{ .Values.lynq_file_storage.image }}
          {{- with .Values.lynq_file_storage.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: lynq-file-storage-config
            - secretRef:
                name: lynq-file-storage-secret
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
