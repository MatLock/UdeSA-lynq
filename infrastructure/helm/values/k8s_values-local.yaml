k8s_namespace: local


manageSecrets: true

# Whether the chart creates the namespace. Local: true (Helm owns it). In prod
# Terraform creates the namespace first (so it can place the external Secrets in
# it before the release), so this is false there.
createNamespace: true

# Whether Helm installs the local infra (mysql, redis, localstack) as in-cluster
# workloads. Local only. In prod this is false: those come from managed services
# (RDS, ElastiCache, S3) and the apps point at them via config.
localInfra: true

# By default lynq-ml uses the Ollama running on your host machine (see
# OLLAMA_BASE_URL below) instead of a heavy in-cluster Ollama. Set this to true
# to deploy Ollama inside the cluster (pulls the model on first start).
ollamaInCluster: false

# The frontend is deployed in-cluster ONLY in local. In prod it lives on
# Cloudflare (Wrangler), so this is false there.
localFrontend: true

# ---------------------------------------------------------------------------
# Central credentials — SINGLE SOURCE OF TRUTH. Both the apps' Secrets and the
# local infra (mysql root password, redis user/pass) reference these, so they
# can never drift. LOCAL ONLY: in prod there are no credentials here (secrets
# are created outside the chart by Terraform / External Secrets).
# ---------------------------------------------------------------------------
credentials:
  db:
    username: root
    password: testpassword123
  redis:
    username: root
    password: testpassword123
  jwt:
    secret: 8d2b6d2a9c5e8f4f8f9d1c7a4e3b5f6d8c9a1e2f3a4b5c6d7e8f9a1b2c3d4e5
  aws:
    accessKeyId: test
    secretAccessKey: test
  bedrock:
    accessKeyId: ""
    secretAccessKey: ""


docker:
  server: https://index.docker.io/v1/
  username: matlock0o
  token: ""
  email: ""


ingress:
  className: nginx
  groupName: lynq
  scheme: internet-facing
  host: lynq.local
  certificateArn: ""

# Local frontend. Defaults to the image published on each release, built with the
# local ingress URLs baked in (Vite bakes them at build time) — so `helm install`
# brings the SPA up with no manual build. To iterate on the frontend locally,
# build and load your own image and override this value:
#   docker build -t lynq-app-frontend:local \
#     --build-arg LYNQ_IAM_BASE_URL=http://lynq.local/lynq-iam \
#     --build-arg LYNQ_BFF_BASE_URL=http://lynq.local/lynq-bff \
#     ./lynq-app-frontend
#   minikube image load lynq-app-frontend:local
#   helm upgrade lynq ./infrastructure/helm -f <values> \
#     --set lynq_app_frontend.image=lynq-app-frontend:local
lynq_app_frontend:
  replicas: 1
  image: matlock0o/lynq:lynq-app-frontend-1.0.12-SNAPSHOT
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

lynq_ml:
  replicas: 1
  image: matlock0o/lynq:lynq-ml-1.0.12-SNAPSHOT
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi
  config:
    PORT: "8084"
    HOST: "0.0.0.0"
    LLM_PROVIDER: ollama
    LLM_TIMEOUT: "60"
    # Points at the Ollama running on your host machine (minikube). For Docker
    # Desktop's Kubernetes use http://host.docker.internal:11434 instead.
    # If you set ollamaInCluster=true, change this to http://ollama:11434.
    OLLAMA_BASE_URL: http://host.minikube.internal:11434
    OLLAMA_MODEL: qwen2.5:7b
    # Only read when LLM_PROVIDER=bedrock; any Converse-capable model id works
    # (anthropic.*, amazon.nova-*, meta.llama*, mistral.*).
    BEDROCK_MODEL_ID: ""
    BEDROCK_REGION: us-east-1
    BEDROCK_MAX_TOKENS: "4096"
    BEDROCK_TEMPERATURE: "0"
    BEDROCK_MAX_ATTEMPTS: "3"
    UDEMY_MAX_COURSES: "2"
    UDEMY_BASE_URL: https://www.udemy.com
    COURSE_SEARCH_TIMEOUT: "15"

lynq_bff:
  replicas: 1
  image: matlock0o/lynq:lynq-bff-1.0.12-SNAPSHOT
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  path: /lynq-bff
  config:
    SPRING_PROFILES_ACTIVE: production
    LYNQ_BACKEND_URL: http://lynq-app-backend-service:8080/lynq-backend-app
    LYNQ_ML_URL: http://lynq-ml-service:8084/lynq-ml
    LYNQ_FILE_STORAGE_URL: http://lynq-file-storage-service:8080/lynq-file-storage

lynq_app_backend:
  replicas: 1
  image: matlock0o/lynq:lynq-app-backend-1.0.12-SNAPSHOT
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  config:
    SPRING_PROFILES_ACTIVE: production
    DB_URL: jdbc:mysql://mysql:3306/lynq_backend_db
    LYNQ_IAM_URL: http://lynq-iam-service:8080/lynq-iam
    LYNQ_ML_URL: http://lynq-ml-service:8084/lynq-ml
    # Files are delegated to lynq-file-storage; this service holds no bucket config.
    LYNQ_FILE_STORAGE_URL: http://lynq-file-storage-service:8080/lynq-file-storage

# Owns every stored file: the bucket credentials, the pre-signed URLs and the
# file metadata all live here.
lynq_file_storage:
  replicas: 1
  image: matlock0o/lynq:lynq-file-storage-1.0.12-SNAPSHOT
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  config:
    SPRING_PROFILES_ACTIVE: production
    DB_URL: jdbc:mysql://mysql:3306/lynq_file_storage_db
    AWS_REGION: us-east-1
    AWS_BUCKET_NAME: lynq-bucket
    AWS_ENDPOINT: http://localstack:4566

lynq_iam:
  replicas: 1
  image: matlock0o/lynq:lynq-iam-1.0.12-SNAPSHOT
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  path: /lynq-iam
  config:
    SPRING_PROFILES_ACTIVE: production
    DB_URL: jdbc:mysql://mysql:3306/lynq_iam_db
    REDIS_ADDRESS: redis
    REDIS_PORT: "6379"
    JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: "15"
    JWT_REFRESH_TOKEN_EXPIRATION_DAYS: "30"
