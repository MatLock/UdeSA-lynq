k8s_namespace: prod

# Secrets are NOT managed by Helm in prod. They are created OUTSIDE the chart
# (Terraform / External Secrets from AWS Secrets Manager) so no secret material
# lives in git. Helm only renders the ConfigMaps; the deployments consume the
# externally-created Secrets by name via secretRef.
#
# The following Secrets must exist in the lynq-prod-namespace before/at deploy,
# with these exact names and keys:
#
#   dockerhub-secret            (type kubernetes.io/dockerconfigjson)
#     .dockerconfigjson         -> Docker Hub auth for matlock0o (public repo, still authenticated)
#
#   lynq-iam-secret             (Opaque)
#     DB_USERNAME, DB_PASSWORD, JWT_SECRET
#     REDIS_USERNAME, REDIS_PASSWORD   (only if the managed Redis requires auth)
#
#   lynq-app-backend-secret     (Opaque)
#     DB_USERNAME, DB_PASSWORD
#     LYNQ_INTERNAL_TOKEN       -> shared secret guarding the /internal/** routes;
#                                  must match the one in lynq-feeders-secret
#     (no bucket credentials: files are delegated to lynq-file-storage)
#
#   lynq-feeders-secret         (Opaque)
#     LYNQ_INTERNAL_TOKEN       -> same value as in lynq-app-backend-secret
#
#   lynq-file-storage-secret    (Opaque)
#     DB_USERNAME, DB_PASSWORD
#     AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY   (omit if using IRSA)
#
#   lynq-ml-secret              (Opaque)
#     AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY   (only if LLM_PROVIDER=bedrock;
#                                                 omit if using IRSA)
#
#   lynq-agent-secret           (Opaque)
#     DB_URL                    -> full SQLAlchemy URL, credentials included:
#                                  mysql+aiomysql://<user>:<pass>@<host>:3306/lynq_agent_db
#                                  (the agent takes one URL, not a user/password pair,
#                                  which is why it is a secret and not ConfigMap data)
#     AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY   (only if LLM_PROVIDER=bedrock;
#                                                 omit if using IRSA)
manageSecrets: false

# Terraform creates the namespace (so the external Secrets can be placed in it
# before the release), so the chart must not create it here.
createNamespace: false

# No in-cluster infra in prod: MySQL/Redis come from managed services (RDS,
# ElastiCache), S3 is real S3 (AWS_ENDPOINT=""), and Ollama is an external
# OLLAMA_BASE_URL. The apps reach them via the config below.
localInfra: false
ollamaInCluster: false
# Frontend is not in the cluster in prod — it is served from Cloudflare (Wrangler).
localFrontend: false

# Docker registry reference for the image pull secret. username/server are public
# (they match the image path); the actual credentials live in the external
# dockerhub-secret created by Terraform, not here.
docker:
  server: https://index.docker.io/v1/
  username: matlock0o

# Internet-facing ingress backed by a single shared AWS ALB (Option A: ACM + ALB).
# Both services share one domain and one load balancer via the same group.name;
# routing is path-based on each service's context-path.
ingress:
  className: alb
  groupName: lynq
  scheme: internet-facing
  # Shared domain for both services.
  host: "REPLACE_HOST"
  # ACM certificate ARN (same region as the EKS cluster).
  certificateArn: "REPLACE_CERTIFICATE_ARN"

# ---------------------------------------------------------------------------
# Per-service ConfigMap env vars (non-sensitive). Environment-specific values
# are parameterized (REPLACE_*) and injected by Terraform at deploy.
# Secrets are intentionally absent here (see manageSecrets note above).
# ---------------------------------------------------------------------------

lynq_ml:
  replicas: 1
  image: matlock0o/lynq:lynq-ml-2.0.2-SNAPSHOT
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi
  config:
    PORT: "8084"
    HOST: "0.0.0.0"
    LLM_PROVIDER: bedrock
    LLM_TIMEOUT: "60"
    OLLAMA_BASE_URL: "REPLACE_OLLAMA_BASE_URL"
    OLLAMA_MODEL: qwen2.5:7b
    BEDROCK_MODEL_ID: "REPLACE_BEDROCK_MODEL_ID"
    BEDROCK_REGION: "REPLACE_BEDROCK_REGION"
    BEDROCK_MAX_TOKENS: "4096"
    BEDROCK_TEMPERATURE: "0"
    BEDROCK_MAX_ATTEMPTS: "3"
    UDEMY_MAX_COURSES: "2"
    UDEMY_BASE_URL: https://www.udemy.com
    COURSE_SEARCH_TIMEOUT: "15"

lynq_agent:
  replicas: 1
  image: matlock0o/lynq:lynq-agent-2.0.2-SNAPSHOT
  # Unused in prod: DB_URL comes whole from the external lynq-agent-secret, so
  # there is no host to interpolate here. Kept so both values files share a shape.
  dbHost: ""
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi
  config:
    PORT: "8090"
    HOST: "0.0.0.0"
    DB_MIGRATE_ON_STARTUP: "true"
    LYNQ_ML_URL: http://lynq-ml-service:8084/lynq-ml
    ML_TIMEOUT: "300"
    LYNQ_AGENT_SYSTEM_USER_ID: 00000000-0000-0000-0000-0000000a6e17
    # Both limits are copied onto each conversation row at creation, so changing
    # them here never rewrites a conversation already under way.
    AGENT_MAX_STEPS: "12"
    AGENT_MAX_TURNS: "10"
    # Operational, never copied onto the row: how long a turn may stay RUNNING
    # before another turn treats it as a dead process. Must stay above the 310s
    # Feign read timeout of lynq-bff, so the agent decides the cutoff.
    AGENT_TURN_TIMEOUT: "600"
    AGENT_JOB_DESCRIPTION_MAX_CHARS: "6000"
    AGENT_HOUSEKEEPING_ENABLED: "true"
    AGENT_HOUSEKEEPING_INTERVAL: "3600"
    AGENT_ABANDON_AFTER_DAYS: "7"
    AGENT_TRACE_TTL_DAYS: "30"
    AGENT_CONVERSATION_TTL_DAYS: "180"
    LLM_PROVIDER: bedrock
    OLLAMA_BASE_URL: "REPLACE_OLLAMA_BASE_URL"
    OLLAMA_MODEL: qwen2.5:7b
    # The loop is meant for Nova Pro (amazon.nova-pro-v1:0); Nova Lite loses the
    # thread on multi-step tool use.
    BEDROCK_MODEL_ID: "REPLACE_AGENT_BEDROCK_MODEL_ID"
    BEDROCK_REGION: "REPLACE_BEDROCK_REGION"
    BEDROCK_MAX_TOKENS: "4096"
    BEDROCK_TEMPERATURE: "0"
    BEDROCK_GUARDRAIL_ID: ""
    BEDROCK_GUARDRAIL_VERSION: DRAFT

lynq_feeders:
  replicas: 1
  image: matlock0o/lynq:lynq-feeders-2.0.2-SNAPSHOT
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi
  config:
    PORT: "8089"
    HOST: "0.0.0.0"
    LYNQ_ML_URL: http://lynq-ml-service:8084/lynq-ml
    LYNQ_BACKEND_URL: http://lynq-app-backend-service:8080/lynq-backend-app
    LYNQ_FEEDERS_SYSTEM_USER_ID: 00000000-0000-0000-0000-00000000feed
    FEEDER_CATEGORIES: ADMINISTRACION,TECNOLOGIA,CONTABILIDAD,RECURSOS_HUMANOS
    FEEDER_SOURCES: bumeran,computrabajo
    FEEDER_JOBS_PER_CATEGORY: "10"
    ML_CONCURRENCY: "2"
    ML_TIMEOUT: "300"
    HTTP_TIMEOUT: "30"
    SCRAPE_TIMEOUT: "25"
  cron:
    schedule: "0 6 * * *"
    timeZone: Etc/UTC
    image: curlimages/curl:8.11.1
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    startingDeadlineSeconds: 600
    backoffLimit: 1
    activeDeadlineSeconds: 5400
    requestTimeoutSeconds: 5400

lynq_bff:
  replicas: 1
  image: matlock0o/lynq:lynq-bff-2.0.2-SNAPSHOT
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  path: /lynq-bff
  config:
    SPRING_PROFILES_ACTIVE: production
    LYNQ_IAM_URL: http://lynq-iam-service:8080/lynq-iam
    LYNQ_BACKEND_URL: http://lynq-app-backend-service:8080/lynq-backend-app
    LYNQ_ML_URL: http://lynq-ml-service:8084/lynq-ml
    LYNQ_FILE_STORAGE_URL: http://lynq-file-storage-service:8080/lynq-file-storage
    LYNQ_AGENT_URL: http://lynq-agent-service:8090/lynq-agent

lynq_app_backend:
  replicas: 1
  image: matlock0o/lynq:lynq-app-backend-2.0.2-SNAPSHOT
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  config:
    SPRING_PROFILES_ACTIVE: production
    DB_URL: "jdbc:mysql://REPLACE_DB_HOST:3306/lynq_backend_db"
    LYNQ_IAM_URL: http://lynq-iam-service:8080/lynq-iam
    LYNQ_ML_URL: http://lynq-ml-service:8084/lynq-ml
    # Files are delegated to lynq-file-storage; this service holds no bucket config.
    LYNQ_FILE_STORAGE_URL: http://lynq-file-storage-service:8080/lynq-file-storage

# Owns every stored file: the bucket credentials, the pre-signed URLs and the
# file metadata all live here.
lynq_file_storage:
  replicas: 1
  image: matlock0o/lynq:lynq-file-storage-2.0.2-SNAPSHOT
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  config:
    SPRING_PROFILES_ACTIVE: production
    DB_URL: "jdbc:mysql://REPLACE_DB_HOST:3306/lynq_file_storage_db"
    AWS_REGION: us-east-1
    AWS_BUCKET_NAME: "REPLACE_BUCKET_NAME"
    # Empty = real AWS endpoints.
    AWS_ENDPOINT: ""
    AWS_PUBLIC_ENDPOINT: ""

lynq_iam:
  replicas: 1
  image: matlock0o/lynq:lynq-iam-2.0.2-SNAPSHOT
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  # No `path` and no Ingress: lynq-iam is reached from inside the cluster only —
  # by lynq-bff, which relays the browser's auth calls, and by lynq-app-backend,
  # which resolves the caller on every request.
  config:
    SPRING_PROFILES_ACTIVE: production
    DB_URL: "jdbc:mysql://REPLACE_DB_HOST:3306/lynq_iam_db"
    REDIS_ADDRESS: "REPLACE_REDIS_HOST"
    REDIS_PORT: "6379"
    JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: "15"
    JWT_REFRESH_TOKEN_EXPIRATION_DAYS: "30"
