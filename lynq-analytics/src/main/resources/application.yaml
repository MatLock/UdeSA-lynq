spring:
  application:
    name: lynq-analytics
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://localhost:3306/lynq_analytics_db
    username: root
    password: ${DB_PASSWORD:federico}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  data:
    redis:
      host: localhost
      port: 6379
      username: root
      password: ${REDIS_PASSWORD:password}
      timeout: 500ms
      connect-timeout: 500ms
  jpa:
    open-in-view: false
    properties:
      hibernate:
        proc:
          param_null_passing: true
        ddl-auto: none
        generate_statistics: false
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: false
  liquibase:
    change-log: classpath:changelog/db.changelog-config.xml
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      sqs:
        endpoint: ${AWS_ENDPOINT:http://localhost:4566}
        queue-not-found-strategy: fail


lynq:
  iam:
    url: http://localhost:8080/lynq-iam
  analytics:
    events:
      queue: ${LYNQ_ANALYTICS_EVENTS_QUEUE:lynq-analytics-events}
    similarity:
      threshold-tags: 2
      fallback-threshold-tags: 1
      min-sample: 5
    standing:
      min-applicants: 5
    salary:
      min-sample: 5
      default-currency: ARS
    cache:
      ttl: PT1H
    tag-frequency:
      cron: ${LYNQ_ANALYTICS_TAG_FREQUENCY_CRON:0 0 8 * * *}
      zone: Etc/UTC


server:
  port: 8091
  servlet:
    context-path: '/lynq-analytics'

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  server:
    port: 8092
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoints:
    web:
      exposure:
        include: [ health, prometheus ]
      base-path: /actuator

logging:
  config: classpath:log4j2-spring.xml
  level:
    root: INFO
    com:
      lynq:
        analytics: INFO

