spring:
  application:
    name: lynq-analytics
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  data:
    redis:
      host: ${REDIS_ADDRESS}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      timeout: 500ms
      connect-timeout: 500ms
  jpa:
    open-in-view: false
    properties:
      hibernate:
        proc:
          param_null_passing: true
        ddl-auto: none
        generate_statistics: false
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: false
  liquibase:
    change-log: classpath:changelog/db.changelog-config.xml
  cloud:
    aws:
      sqs:
        queue-not-found-strategy: fail

lynq:
  iam:
    url: ${LYNQ_IAM_URL:http://lynq-iam:8080/lynq-iam}
  backend:
    url: ${LYNQ_BACKEND_URL:http://lynq-app-backend:8080/lynq-backend-app}
  internal:
    token: ${LYNQ_INTERNAL_TOKEN:}
  analytics:
    events:
      queue: ${LYNQ_ANALYTICS_EVENTS_QUEUE:lynq-analytics-events}
    similarity:
      threshold-tags: 2
      fallback-threshold-tags: 1
      min-sample: 5
    standing:
      min-applicants: 5
    salary:
      min-sample: 5
      default-currency: ARS
    time-to-fill:
      min-sample: 5
      expired-after-days: 25
    cache:
      ttl: PT1H
    snapshot:
      zone: America/Argentina/Buenos_Aires
    benchmark:
      reach-threshold: 60
      min-relevant-jobs: 5
      min-peers: 5
      relevance-threshold-tags: 1
      peer-threshold-tags: 2
      skill-unlocks: 5
      pairs-per-request: 2000
      series-days: 90
    market:
      top-skills: 10
      weeks: 12
      min-sample: 5
      currencies: [ ARS, USD ]


server:
  port: 8080
  servlet:
    context-path: '/lynq-analytics'

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  server:
    port: 8081
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoints:
    web:
      exposure:
        include: [ health, prometheus ]
      base-path: /actuator

logging:
  level:
    root: INFO
    com:
      lynq:
        analytics: INFO
