spring:
  application:
    name: lynq-analytics
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  data:
    redis:
      host: ${REDIS_ADDRESS}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      timeout: 500ms
      connect-timeout: 500ms
  jpa:
    open-in-view: false
    properties:
      hibernate:
        proc:
          param_null_passing: true
        ddl-auto: none
        generate_statistics: false
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: false
  liquibase:
    change-log: classpath:changelog/db.changelog-config.xml
  cloud:
    aws:
      sqs:
        queue-not-found-strategy: fail

lynq:
  iam:
    url: ${LYNQ_IAM_URL:http://lynq-iam:8080/lynq-iam}
  analytics:
    events:
      queue: ${LYNQ_ANALYTICS_EVENTS_QUEUE:lynq-analytics-events}
    similarity:
      include-synthetic: ${LYNQ_ANALYTICS_SIMILARITY_INCLUDE_SYNTHETIC:true}
      threshold-tags: 2
      fallback-threshold-tags: 1
      min-sample: 5
    cache:
      ttl: PT1H
    tag-frequency:
      cron: ${LYNQ_ANALYTICS_TAG_FREQUENCY_CRON:0 0 8 * * *}
      zone: Etc/UTC


server:
  port: 8080
  servlet:
    context-path: '/lynq-analytics'

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  server:
    port: 8081
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoints:
    web:
      exposure:
        include: [ health, prometheus ]
      base-path: /actuator

logging:
  level:
    root: INFO
    com:
      lynq:
        analytics: INFO
