spring:
  application:
    name: lynq-analytics-test
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        ddl-auto: none
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: false
  liquibase:
    change-log: classpath:changelog/db.changelog-config.xml
  cloud:
    aws:
      sqs:
        queue-not-found-strategy: fail

lynq:
  iam:
    url: http://localhost:9999/lynq-iam
  analytics:
    events:
      queue: lynq-analytics-events
    tag-frequency:
      cron: "-"

server:
  port: 0
  servlet:
    context-path: '/lynq-analytics'

management:
  server:
    port: -1

logging:
  level:
    root: WARN
    com.lynq: INFO
